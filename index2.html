<html lang="PL">
    <head>
        <meta charset="UTF-8">
        <title>Strona 2</title>
        <style>
            body {
                display: flex;
            }
            .lewa {
                border: 2px solid black;
                width: 25%;
            }
            header, nav, main, footer {
                border: 2px solid black;
                border-bottom: 1px solid black;
                padding: 20px;
                box-sizing: border-box;
                height: 100%;
            }
            .prawa {
                height: 100%;
                display: flex;
                flex-direction: column;
                flex: 1;
            }
        </style>
    </head>
    <body>
        <aside class="lewa">Blok boczny</aside>
        <section class="prawa">
            <header>Blok nagłówkowy</header>
            <nav>Blok nawigacyjny</nav>
            <main>Blok główny</main>
            <footer>Blok stopki</footer>
            <button onclick="location.href='index.html'">Powrót</button>
        </section>
    </body>
</html>
